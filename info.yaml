# Tiny Tapeout project information, written by GateLab (Project Settings ▸ Build ▸ Tiny Tapeout).
project:
  title:        "design 30"
  author:       "Richard Klingler"
  discord:      ""
  description:  "Echoes bytes from a UART and counts them"
  language:     "Verilog"
  clock_hz:     25000000

  # How many tiles the design occupies.
  tiles: "1x1"

  # The top module; it must start with "tt_um_".
  top_module:  "tt_um_design_30"

  # The design's source files, relative to src/.
  source_files:
    - "project.v"
    - "uart_echo.v"
    - "uart_receiver.v"
    - "uart_transmitter.v"

# The pinout of the design. Pins that aren't used stay empty.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: "UART RX"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "count[0]"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: "UART TX"
  uo[5]: "count[4]"
  uo[6]: "count[5]"
  uo[7]: "count[6]"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
